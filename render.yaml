# EmailAIguy static landing page — https://emailaiguy.com
# Plain HTML/CSS at repo root; no build step.

services:
  - type: web
    name: emailaiguy-website
    runtime: static
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: echo "Static site — no build"
    staticPublishPath: .
    domains:
      - emailaiguy.com
      - www.emailaiguy.com

    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Frame-Options
        value: DENY
